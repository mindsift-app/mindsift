# MindSift – Docker Compose
# Everything is set in the file .env next to this one. What each variable does is explained in
# .env.example (copy it: cp .env.example .env). This file only maps them, with defaults.
services:
  mindsift:
    image: ghcr.io/mindsift-app/mindsift:stable
    container_name: mindsift
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    # Same as the HEALTHCHECK in the image; repeated here for podman, which ignores it in OCI images
    healthcheck:
      test: ["CMD-SHELL", "wget -q -Y off -T 4 -O /dev/null http://127.0.0.1:$${PORT:-8080}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - TZ=${TZ:-Europe/Berlin}
      - JWT_SECRET=${JWT_SECRET:-}
      - SECRETS_KEY=${SECRETS_KEY:-}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # First administrator on the first start (ignored once an account exists)
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # Or the password from a file (Docker secret), so it does not show in `docker inspect`: instead of
      # ADMIN_PASSWORD, not both. Give the service  secrets: [admin_password]  and add at the top level
      #   secrets: { admin_password: { file: ./admin_password.txt } }   (readable for UID 1000)
      # - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-}
      # Sign-in through an OpenID Connect provider (Authentik, Authelia, Keycloak …), see .env.example
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - OIDC_AUTO_CREATE=${OIDC_AUTO_CREATE:-}
      - OIDC_PASSWORD_LOGIN=${OIDC_PASSWORD_LOGIN:-}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      # Or the secret from a file (Docker secret) instead of OIDC_CLIENT_SECRET, not both
      # - OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc_client_secret
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-}
      - REGISTRATION_DOMAINS=${REGISTRATION_DOMAINS:-}
      - REGISTRATION_VERIFY_EMAIL=${REGISTRATION_VERIFY_EMAIL:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-private}
      - RETENTION_ALLOW_NEVER=${RETENTION_ALLOW_NEVER:-}
      - LOGIN_PROTECTION=${LOGIN_PROTECTION:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEBUG=${DEBUG:-false}
      - MINDSIFT_DEMO=${MINDSIFT_DEMO:-false}
      - MINDA_DEMO=${MINDA_DEMO:-}   # earlier name of MINDSIFT_DEMO, still read
      - DEMO_RESET_MINUTES=${DEMO_RESET_MINUTES:-20}
      # Email
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-MindSift}
      - NOTIFY_DIGEST_MINUTES=${NOTIFY_DIGEST_MINUTES:-5}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_SKIP_VERIFY=${SMTP_SKIP_VERIFY:-false}
      # Web push: unset, MindSift creates the keys itself
      # - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      # Legal notice / privacy policy
      - LEGAL_IMPRINT_URL=${LEGAL_IMPRINT_URL:-}
      - LEGAL_PRIVACY_URL=${LEGAL_PRIVACY_URL:-}
      - LEGAL_IMPRINT_CONTENT=${LEGAL_IMPRINT_CONTENT:-}
      - LEGAL_PRIVACY_CONTENT=${LEGAL_PRIVACY_CONTENT:-}
      - LEGAL_IMPRINT_CONTENT_FILE=${LEGAL_IMPRINT_CONTENT_FILE:-}
      - LEGAL_PRIVACY_CONTENT_FILE=${LEGAL_PRIVACY_CONTENT_FILE:-}
      # Your own link in the footer (https:// only)
      # - LEGAL_CUSTOM_LINK_LABEL=${LEGAL_CUSTOM_LINK_LABEL:-}
      # - LEGAL_CUSTOM_LINK_URL=${LEGAL_CUSTOM_LINK_URL:-}
      # Images and audio in notes
      - MEDIA_MAX_IMAGE_MB=${MEDIA_MAX_IMAGE_MB:-15}
      - MEDIA_MAX_AUDIO_MB=${MEDIA_MAX_AUDIO_MB:-50}
      - MEDIA_QUOTA_MB=${MEDIA_QUOTA_MB:-0}
      - MEDIA_DEMO_MAX_MB=${MEDIA_DEMO_MAX_MB:-3}
      # Speech recognition
      - STT_URL=${STT_URL:-}
      - STT_MODEL=${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_DISABLED=${STT_DISABLED:-false}
      - STT_ALLOW_BROWSER=${STT_ALLOW_BROWSER:-true}
      - STT_MAX_SECONDS=${STT_MAX_SECONDS:-600}
      - STT_MAX_UPLOAD_MB=${STT_MAX_UPLOAD_MB:-25}
      - STT_MAX_PARALLEL=${STT_MAX_PARALLEL:-1}
      - STT_PER_USER_PER_HOUR=${STT_PER_USER_PER_HOUR:-60}
      - STT_TIMEOUT_SECONDS=${STT_TIMEOUT_SECONDS:-120}
      - STT_VAD_FILTER=${STT_VAD_FILTER:-true}

  # Optional: your own speech recognition (Whisper). install.sh sets it up when asked. By hand:
  #   1. remove the hashes in front of the "whisper" block below
  #   2. set in .env:  STT_URL=http://whisper:8000
  #   3. mkdir -p whisper && sudo chown 1000:1000 whisper   (the container runs as UID 1000)
  #   4. docker compose up -d
  # MindSift downloads the model into ./whisper on the first start (large-v3-turbo about 1.6 GB).
  # RAM: large-v3-turbo about 2 GB, small about 1 GB. No port to the outside needed.
  #
  # whisper:
  #   image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
  #   container_name: mindsift-whisper
  #   restart: unless-stopped
  #   volumes:
  #     - ./whisper:/home/ubuntu/.cache/huggingface/hub
  #   environment:
  #     - WHISPER__COMPUTE_TYPE=int8   # faster on the CPU, hardly any loss in quality
  #     - WHISPER__TTL=-1              # keep the model in memory instead of unloading it after 5 min
  #     - ENABLE_UI=false              # without the speaches web interface
  #     - LOG_LEVEL=info
