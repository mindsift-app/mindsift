# golangci-lint (ci/local-checks.sh): the standard linters (errcheck, govet, ineffassign, staticcheck,
# unused) over cmd/ and internal/. staticcheck runs only here, not as a step of its own.
version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        # golangci-lint's defaults
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ST1005 wants error texts in lower case and without a full stop. The errors people read in the app
        # are German sentences whose text is the key of the translation (internal/i18n, see Doku/i18n.md),
        # so they are written as sentences with a capital letter and often a full stop.
        - -ST1005
    errcheck:
      # Closing and rolling back in cleanup paths (defer, error returns): the error that matters has
      # already been returned, and the close of a written file is checked where it is written.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Conn).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*net/smtp.Client).Close
        - os.Remove
        # Streaming to an http.ResponseWriter (metrics, server-sent events): a client that went away is
        # noticed through the request context, not through the write
        - fmt.Fprintf
  exclusions:
    rules:
      # Test setup: a step that fails shows up in the assertions that follow
      - path: _test\.go
        linters:
          - errcheck
