name: MindSift Desktop Spike (Gitea)

# Builds the desktop spike (desktop/, Wails v3) for Linux and Windows and offers the binaries as artifacts
# of the workflow run in the Gitea UI (Actions -> run -> Artifacts). Only for the desktop-spike branch and
# manual runs; it builds no images and touches no registry.
# The steps are desktop/build.sh, the same script as locally; in CI it runs with docker and copies the
# sources into the build containers (node for the frontend, golang trixie with GTK4/WebKitGTK for Linux
# and the cgo-free cross-compile for Windows), because the job may itself run in a container.
# The actions are the same releases as in build-and-publish.yaml, pinned to commits. They run on Node 24,
# which the runner's job image (Gitea runner images, ubuntu-latest) ships.
on:
  push:
    branches:
      - desktop-spike
  workflow_dispatch:

concurrency:
  group: desktop-spike
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux and Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build frontend, Linux and Windows binary
        run: ENGINE=docker COPY_MODE=1 desktop/build.sh

      - name: Upload Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mindsift-desktop-linux-amd64
          path: desktop/out/mindsift-desktop-linux-amd64
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mindsift-desktop-windows-amd64
          path: desktop/out/mindsift-desktop-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7
