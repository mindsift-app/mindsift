name: MindSift CI & Docker Release (Gitea)

# The private Gitea runs this for main only: the image :latest in its own registry, without tests (they
# run on the developer's machine: targeted checks for every push, the full ci/local-checks.sh before a
# release). dev goes to GitHub only, whose :dev image the demo runs, and version tags are only pushed to
# GitHub, so this builds no tags. The public images on GitHub come from
# .github/workflows/build-and-publish.yaml with the same build plan (ci/build-plan.sh); they are built for
# amd64 and arm64, the one here for the platform of this runner only.
# Only GitHub's main build tests again (ci/build-plan.sh, TEST_REFS). The image carries commit, git tree
# and dependencies as labels (the plan compares them with the image last published).
# Trivy (ci/trivy-scan.sh) checks the image before it is pushed when Dockerfile, go.mod or go.sum changed.
# The actions are the same releases as on GitHub, pinned to the same commits. They run on Node 24, which
# the runner's job image (Gitea runner images, ubuntu-latest) ships.
on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    name: Build, Test in Container & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Registry & Image
        id: prep
        # Registry and image come from the server this runs on (its container registry), no fixed host
        run: |
          REGISTRY_HOST=$(echo "${GITHUB_SERVER_URL}" | sed -E 's#^https?://##' | sed 's#/$##')
          echo "registry=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "${REGISTRY_HOST}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"

      - name: Login to Gitea Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.prep.outputs.registry }}
          username: ${{ steps.prep.outputs.actor }}
          password: ${{ secrets.PUSH_TOKEN || secrets.GITEA_TOKEN || github.token }}

      - name: Build Plan
        id: plan
        run: REF="${GITHUB_REF:-}" COMMIT="${GITHUB_SHA:-HEAD}" IMAGE="${{ steps.prep.outputs.image }}" ci/build-plan.sh

      - name: Build (with or without tests), then Push
        run: |
          IMAGE="${{ steps.prep.outputs.image }}"
          TAGS="${{ steps.plan.outputs.tags }}"
          echo "ℹ️ ${{ steps.plan.outputs.reason }}"
          TAG_ARGS=""
          for t in ${TAGS}; do TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${t}"; done
          DOCKER_BUILDKIT=1 docker build --progress=plain \
            --build-arg APP_VERSION="${{ steps.plan.outputs.app_version }}" \
            --build-arg IMAGE_VERSION="${{ steps.plan.outputs.image_version }}" \
            --build-arg SKIP_TESTS="${{ steps.plan.outputs.skip_tests }}" \
            --build-arg GIT_SHA="${{ steps.plan.outputs.sha }}" \
            --build-arg GIT_TREE="${{ steps.plan.outputs.tree }}" \
            --build-arg GIT_DEPS="${{ steps.plan.outputs.deps }}" \
            ${TAG_ARGS} .
          # Security scan before anything is pushed (when the dependencies changed)
          if [ "${{ steps.plan.outputs.scan }}" = "1" ]; then ci/trivy-scan.sh "${IMAGE}:${TAGS%% *}"; fi
          for t in ${TAGS}; do docker push "${IMAGE}:${t}"; done
