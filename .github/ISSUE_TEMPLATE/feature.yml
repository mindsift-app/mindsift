name: Feature idea
description: Something MindSift could do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please look at "Not (yet) in MindSift" in the README and the ideas in [Doku/flaws.md](https://github.com/mindsift-app/mindsift/blob/main/Doku/flaws.md) first; a comment on an existing issue helps as much as a new one.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The situation and what gets in the way today, rather than a finished solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea, and how other apps solve it if you know one.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Who would use it (just you, a family, a team), phone or desktop, screenshots or sketches.
