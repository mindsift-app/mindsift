name: MindSift CI & Docker Release

# Public images in GitHub's container registry (ghcr.io/mindsift-app/mindsift):
#   push to dev      -> :dev
#   push/merge main  -> :latest
#   git tag v1.2.0   -> :v1.2.0 and :stable
#   git tag v1.2.0-rc.1 (pre-release) -> :v1.2.0-rc.1 only, :stable stays
# Same build plan as the private Gitea pipeline (ci/build-plan.sh). Every push is tested beforehand on the
# developer's machine (ci/local-checks.sh); here only main, the public release, runs the tests once more
# (TEST_REFS). A tag on the commit of :latest only retags it.
# Trivy (ci/trivy-scan.sh) checks every tag before it is pushed, branches only when Dockerfile, go.mod or
# go.sum changed; .github/workflows/security-scan.yaml checks :stable and :latest every week.
# After the images of a tag, release.yaml creates its release page from the CHANGELOG.
on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    name: Build, Test in Container & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image
        id: prep
        run: echo "image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Plan
        id: plan
        run: REF="${GITHUB_REF}" COMMIT="${GITHUB_SHA}" IMAGE="${{ steps.prep.outputs.image }}" TEST_REFS="refs/heads/main" ci/build-plan.sh

      - name: Build (with or without tests) or Retag, then Push
        run: |
          IMAGE="${{ steps.prep.outputs.image }}"
          TAGS="${{ steps.plan.outputs.tags }}"
          echo "ℹ️ ${{ steps.plan.outputs.reason }}"
          if [ "${{ steps.plan.outputs.action }}" = "retag" ]; then
            SOURCE="${{ steps.plan.outputs.source_image }}"
            docker pull "${SOURCE}"
            if [ "${{ steps.plan.outputs.scan }}" = "1" ]; then ci/trivy-scan.sh "${SOURCE}"; fi
            for t in ${TAGS}; do
              docker tag "${SOURCE}" "${IMAGE}:${t}"
              docker push "${IMAGE}:${t}"
            done
          else
            TAG_ARGS=""
            for t in ${TAGS}; do TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${t}"; done
            # The source label links the package on GitHub to this repository
            DOCKER_BUILDKIT=1 docker build --progress=plain \
              --build-arg APP_VERSION="${{ steps.plan.outputs.app_version }}" \
              --build-arg SKIP_TESTS="${{ steps.plan.outputs.skip_tests }}" \
              --build-arg GIT_SHA="${{ steps.plan.outputs.sha }}" \
              --build-arg GIT_TREE="${{ steps.plan.outputs.tree }}" \
              --build-arg GIT_DEPS="${{ steps.plan.outputs.deps }}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              ${TAG_ARGS} .
            # Security scan before anything is pushed (tags always, branches when the dependencies changed)
            if [ "${{ steps.plan.outputs.scan }}" = "1" ]; then ci/trivy-scan.sh "${IMAGE}:${TAGS%% *}"; fi
            for t in ${TAGS}; do docker push "${IMAGE}:${t}"; done
          fi

  # A version tag gets its release page once its images are out (release.yaml)
  release:
    name: GitHub Release
    needs: build-test-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ github.ref_name }}
