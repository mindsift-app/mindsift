name: MindSift CI & Docker Release

# Public images in GitHub's container registry (ghcr.io/mindsift-app/mindsift), each for amd64 and arm64:
#   push to dev      -> :dev
#   push/merge main  -> :latest
#   git tag v1.2.0   -> :v1.2.0 and :stable
#   git tag v1.2.0-rc.1 (pre-release) -> :v1.2.0-rc.1 only, :stable stays
# Same build plan as the private Gitea pipeline (ci/build-plan.sh). Every push is tested beforehand on the
# developer's machine (ci/local-checks.sh); here only main, the public release, runs the tests once more
# (TEST_REFS). A tag on the commit of :latest only retags it.
# Trivy (ci/trivy-scan.sh) checks every tag before it is pushed, branches only when Dockerfile, go.mod or
# go.sum changed; .github/workflows/security-scan.yaml checks :stable and :latest every week.
# After the images of a tag, release.yaml creates its release page from the CHANGELOG and attaches the
# binaries.
on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  # Platforms of every published tag. The Dockerfile checks and builds once on the runner and
  # cross-compiles the binary; only its last stage runs emulated for arm64.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-test-push:
    name: Build, Test in Container & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image
        id: prep
        run: echo "image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # arm64 on an amd64 runner: QEMU for the last stage of the Dockerfile, and a builder that can build
      # and push several platforms as one image (the default one cannot)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Plan
        id: plan
        run: REF="${GITHUB_REF}" COMMIT="${GITHUB_SHA}" IMAGE="${{ steps.prep.outputs.image }}" TEST_REFS="refs/heads/main" ci/build-plan.sh

      - name: Build (with or without tests) or Retag, then Push
        run: |
          IMAGE="${{ steps.prep.outputs.image }}"
          TAGS="${{ steps.plan.outputs.tags }}"
          echo "ℹ️ ${{ steps.plan.outputs.reason }}"
          TAG_ARGS=""
          for t in ${TAGS}; do TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${t}"; done
          # The scan looks at the image for the runner's platform (amd64): the other platforms get the
          # same Alpine packages and the same Go modules.
          if [ "${{ steps.plan.outputs.action }}" = "retag" ]; then
            SOURCE="${{ steps.plan.outputs.source_image }}"
            if [ "${{ steps.plan.outputs.scan }}" = "1" ]; then
              docker pull "${SOURCE}"
              ci/trivy-scan.sh "${SOURCE}"
            fi
            # Copies the image with all its platforms inside the registry (docker tag and push would
            # keep only the runner's)
            docker buildx imagetools create ${TAG_ARGS} "${SOURCE}"
          else
            # The source label links the package on GitHub to this repository. Without provenance: it
            # would show up as a third platform "unknown/unknown" in the registry.
            BUILD_ARGS=(--progress=plain --provenance=false
              --build-arg "APP_VERSION=${{ steps.plan.outputs.app_version }}"
              --build-arg "SKIP_TESTS=${{ steps.plan.outputs.skip_tests }}"
              --build-arg "GIT_SHA=${{ steps.plan.outputs.sha }}"
              --build-arg "GIT_TREE=${{ steps.plan.outputs.tree }}"
              --build-arg "GIT_DEPS=${{ steps.plan.outputs.deps }}"
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}")
            # Security scan before anything is pushed (tags always, branches when the dependencies
            # changed). What this build does, the build for all platforms below takes from the cache.
            if [ "${{ steps.plan.outputs.scan }}" = "1" ]; then
              docker buildx build "${BUILD_ARGS[@]}" --load -t "${IMAGE}:${TAGS%% *}" .
              ci/trivy-scan.sh "${IMAGE}:${TAGS%% *}"
            fi
            docker buildx build "${BUILD_ARGS[@]}" --platform "${PLATFORMS}" --push ${TAG_ARGS} .
          fi
          # A tag that lost a platform would only be noticed by the people running it
          for t in ${TAGS}; do
            PUBLISHED="$(docker buildx imagetools inspect "${IMAGE}:${t}")"
            for p in ${PLATFORMS//,/ }; do
              echo "${PUBLISHED}" | grep -Eq "Platform: +${p}\$" || { echo "::error::${IMAGE}:${t} is not published for all of ${PLATFORMS} (not in its list: ${p})"; exit 1; }
            done
          done

  # A version tag gets its release page once its images are out (release.yaml)
  release:
    name: GitHub Release
    needs: build-test-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ github.ref_name }}
