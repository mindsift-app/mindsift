name: GitHub Release

# Creates the release page of a version tag, with its CHANGELOG section as text (ci/release-notes.sh), and
# attaches the server binaries for Linux, taken out of the images of that tag (ci/release-binaries.sh),
# and the desktop app built from the tag (ci/release-desktop.sh: Linux binary, Flatpak bundle, Windows
# exe and installer), with one SHA256SUMS for all of them.
# Called by build-and-publish.yaml once the images of a tag are pushed; by hand ("Run workflow") for a tag
# that has no release yet, or to refresh the text and files of an existing one. It runs with the workflow
# token, so the release shows github-actions[bot] as author, not a person. Tags with "-" become
# pre-releases.
# All files are built before the page is created, and gh creates a new release as a draft until its files
# are uploaded: the website's links to releases/latest/download/<name> never point at a release without
# them. A failed desktop build does not hold back the page and the server binaries; the job fails at the
# end, and a manual run with the same tag attaches the desktop files later.
# Afterwards flatpak-repo.yaml puts the Flatpak bundle of a release (no "-") into MindSift's own Flatpak
# repository (flatpak.mindsift.app), when the desktop app was built; without its secrets it only leaves a
# notice.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      FLATPAK_REPO_DEPLOY_KEY:
        required: false
      FLATPAK_GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v1.2.0'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      desktop: ${{ steps.desktop.outputs.built }}
    steps:
      - name: Checkout Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          # gh uses GH_TOKEN; the token does not stay in .git while npm and Go build the desktop app
          persist-credentials: false

      # From the tag's sources, not from an image: a tag build only retags the tested :latest, the desktop
      # app has no image. desktop/build.sh and the Flatpak build run in containers (node, golang trixie
      # with GTK 4 / WebKitGTK 6.0, a Debian container with SYS_ADMIN for flatpak-builder), without .git,
      # npm without install scripts and Go only with the modules go.sum names.
      - name: Build Desktop App
        id: desktop
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ ! -x ci/release-desktop.sh ]; then
            echo "::notice::${TAG} is from before the desktop release files, nothing to build"
            exit 0
          fi
          # Room for the GNOME runtime and SDK of the Flatpak build and the build images; the runner's
          # preinstalled toolchains are not needed here
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          ENGINE=docker COPY_MODE=1 ci/release-desktop.sh "${TAG}" binaries
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Server Binaries and Checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # The checkout is the tag's: versions from before the binaries have neither the script nor
          # an image for arm64
          if [ ! -x ci/release-binaries.sh ]; then
            echo "::notice::${TAG} is from before the release binaries, nothing to attach"
            exit 0
          fi
          IMAGE="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${TAG}"
          # Also writes SHA256SUMS over the desktop files already in the folder
          ci/release-binaries.sh "${IMAGE}" "${TAG}" binaries

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          ci/release-notes.sh "${TAG}" > notes.md
          shopt -s nullglob
          FILES=(binaries/*)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "MindSift ${TAG}" --notes-file notes.md
            if [ "${#FILES[@]}" -gt 0 ]; then gh release upload "${TAG}" "${FILES[@]}" --clobber; fi
          else
            KIND=--latest
            if [[ "${TAG}" == *-* ]]; then KIND=--prerelease; fi
            # With files, gh keeps the new release a draft until they are uploaded, then publishes it
            gh release create "${TAG}" --verify-tag --title "MindSift ${TAG}" --notes-file notes.md "${KIND}" "${FILES[@]}"
          fi

      - name: Report Failed Desktop Build
        if: steps.desktop.outcome == 'failure'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::error::The desktop app of ${TAG} was not built (see the step Build Desktop App); the release has the server binaries only. Run this workflow by hand with ${TAG} to attach it."
          exit 1

  # The release's Flatpak bundle into the own Flatpak repository; a failed desktop build fails the job
  # above, so this one is skipped then
  flatpak-repo:
    name: Flatpak Repository
    needs: release
    if: needs.release.outputs.desktop == 'true' && !contains(inputs.tag, '-')
    permissions:
      contents: read
    uses: ./.github/workflows/flatpak-repo.yaml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      FLATPAK_REPO_DEPLOY_KEY: ${{ secrets.FLATPAK_REPO_DEPLOY_KEY }}
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
